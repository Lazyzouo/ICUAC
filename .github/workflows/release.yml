name: Automatic Release / 自动发布

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Read project version
        id: version
        shell: bash
        run: |
          VERSION="$(./gradlew properties -q | awk '/^version:/ {print $2}')"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build release artifacts
        if: steps.version.outputs.exists == 'false'
        run: ./gradlew clean build --no-daemon
      - name: Generate SHA-256 files
        if: steps.version.outputs.exists == 'false'
        working-directory: build/libs
        shell: bash
        run: |
          for file in *.jar; do sha256sum "$file" > "$file.sha256"; done
      - name: Extract bilingual changelog
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" {capture=1; next}
            capture && $0 ~ "^## \\[" {exit}
            capture {print}
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Publish GitHub Release
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            build/libs/ICUAC-"$VERSION".jar \
            build/libs/ICUAC-"$VERSION".jar.sha256 \
            build/libs/ICUAC-"$VERSION"-en_US.jar \
            build/libs/ICUAC-"$VERSION"-en_US.jar.sha256 \
            build/libs/ICUAC-"$VERSION"-sources.jar \
            build/libs/ICUAC-"$VERSION"-sources.jar.sha256 \
            --target "$GITHUB_SHA" \
            --title "ICUAC $VERSION" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
