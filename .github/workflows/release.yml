name: Automatic Release / 自动发布

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Read project version
        id: version
        shell: bash
        run: |
          VERSION="$(./gradlew properties -q | awk '/^version:/ {print $2}')"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build release artifacts
        if: steps.version.outputs.exists == 'false'
        run: ./gradlew clean build --no-daemon
      - name: Verify exact release artifact names
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: ./scripts/verify-release.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Assemble official release notes
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" {capture=1; next}
            capture && $0 ~ "^## \\[" {exit}
            capture {print}
          ' CHANGELOG.md > changelog-notes.md
          test -s changelog-notes.md
          sed "s/{{VERSION}}/$VERSION/g" .github/RELEASE_NOTICE.md > release-notes.md
          printf '\n\n---\n\n' >> release-notes.md
          cat changelog-notes.md >> release-notes.md
      - name: Publish GitHub Release
        if: steps.version.outputs.exists == 'false'
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v$VERSION" \
            build/libs/ICUAC-"$VERSION"-zh.cn.jar \
            build/libs/ICUAC-"$VERSION"-en.us.jar \
            --target "$GITHUB_SHA" \
            --title "ICUAC $VERSION" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
