documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"
configuration:
  - changed-files:
      - any-glob-to-any-file:
          - "presets/**"
          - "src/main/resources/**"
java:
  - changed-files:
      - any-glob-to-any-file:
          - "src/**/*.java"
github-actions:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
