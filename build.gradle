plugins {
    id 'java'
}

group = 'com.icu.icuac'
version = '2.2.0'
def pluginAuthor = 'Lazyz'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:26.2.build.87-stable'
    testImplementation 'io.papermc.paper:paper-api:26.2.build.87-stable'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

sourceSets {
    main {
        resources {
            exclude 'config.yml'
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [
            pluginVersion: version,
            pluginName: project.name,
            pluginAuthor: pluginAuthor
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching('plugin.yml') {
        expand props
    }
    from('presets/config.zh_CN.yml') {
        rename { 'config.yml' }
    }
    from('presets') {
        include 'config.zh_CN.yml', 'config.en_US.yml'
        into 'defaults'
    }
}

tasks.named('jar') {
    archiveBaseName.set('ICUAC')
    archiveClassifier.set('zh.cn')
}

tasks.register('englishJar', Jar) {
    dependsOn classes
    archiveBaseName.set('ICUAC')
    archiveClassifier.set('en.us')
    from(sourceSets.main.output) {
        exclude 'config.yml'
    }
    from('presets/config.en_US.yml') {
        rename { 'config.yml' }
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('englishJar')
}

tasks.named('test') {
    useJUnitPlatform()
}
