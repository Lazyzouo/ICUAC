# =============================================================================
# ICUAC Official English Preset
# Tested on Paper/Folia 1.21.11 with Java 21
# Personal server values belong in plugins/ICUAC/config.yml and are not synced
# =============================================================================

# Interface language: zh_CN (Simplified Chinese) or en_US (English)
language: en_US

# GitHub update checker. Verified releases are staged for the next restart.
updates:
  enabled: true
  auto-download: true

# Global online inventory scan period. 20 ticks are approximately one second.
# Changing this value requires a server/plugin restart; hot reload does not reschedule it.
global-settings:
  inventory-check-interval-ticks: 1

# Minimum delay between end-crystal attacks, in milliseconds, for every game mode.
crystal:
  hit-interval: 200

# Command protection
command-blocking-enabled: true
command-blocking-max-depth: 4
blocked-commands:
  - kill
  - effect
hide-blocked-commands-from-tab: true
permission-bypass-enabled: false
block-command-blocks: true
block-console-commands: false

# Creative mode isolation. Replace creative_world with the exact allowed world name.
creative-world-whitelist:
  enabled: true
  check-interval-ticks: 20
  worlds:
    - creative_world
  source-game-modes:
    - CREATIVE
  ignored-game-modes:
    - SPECTATOR
  target-game-mode: SURVIVAL
  log-switches: true

features:
  # Kill players below the configured world-environment threshold.
  prevent-below-bedrock:
    enabled: true
    threshold-normal: -65.0
    threshold-nether: -1.0
  # Kill players above the Nether roof in exact listed worlds.
  # An empty worlds list applies to every Nether world.
  prevent-above-nether-bedrock:
    enabled: true
    threshold: 127
    worlds:
      - world_nether
  # Clear item and experience drops in exact listed worlds. ICUAC whitelist does not bypass this.
  death-drop-control:
    enabled: true
    no-drop-worlds: []

# Bukkit Material names removed from non-bypassed players and containers.
banned-items:
  - COMMAND_BLOCK
  - COMMAND_BLOCK_MINECART
  - REPEATING_COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - BARRIER
  - STRUCTURE_BLOCK
  - STRUCTURE_VOID
  - LIGHT
  - JIGSAW
  - SPAWNER
  - BEDROCK
  - END_PORTAL_FRAME
  - END_GATEWAY
  - ENCHANTED_GOLDEN_APPLE
  - TNT

illegal-effects-settings:
  check-duration: true
  max-duration-ticks: 12000
  check-level: true
  # Values are zero-based amplifiers: 3 permits the displayed level IV.
  specific-level-limits:
    DAMAGE_RESISTANCE: 4
  default-level-fallback: 10
  default-level-limits:
    SLOW: 7
    RESISTANCE: 5
    SPEED: 3
    HASTE: 3
    STRENGTH: 3
    JUMP: 3
    REGENERATION: 3
    FIRE_RESISTANCE: 3
    WATER_BREATHING: 3
    INVISIBILITY: 3
    NIGHT_VISION: 3
    HEALTH_BOOST: 3
    ABSORPTION: 3
    SATURATION: 3
    GLOWING: 3
    LEVITATION: 3
    LUCK: 3
    SLOW_FALLING: 3
    CONDUIT_POWER: 3
    DOLPHINS_GRACE: 3
    BAD_OMEN: 3
    HERO_OF_THE_VILLAGE: 3
    MINING_FATIGUE: 3
    CONFUSION: 3
    BLINDNESS: 3
    HUNGER: 3
    WEAKNESS: 3
    POISON: 3
    WITHER: 3
    UNLUCK: 3

# Clamp oversized stacks to the material's vanilla maximum.
illegal-stack-settings:
  enabled: true

nbt-settings:
  enabled: true
  check-serialized-size: true
  max-serialized-bytes: 65536
  check-meta-string-size: true
  max-meta-string-length: 16384
  check-banned-keywords: true
  banned-meta-keywords:
    - minecraft:custom_data
    - minecraft:attribute_modifiers
    - minecraft:entity_data
    - minecraft:bucket_entity_data
    - minecraft:block_entity_data
    - minecraft:debug_stick_state
    - minecraft:creative_slot_lock
  check-persistent-data: true
  max-persistent-data-keys: 16
  max-persistent-data-bytes: 4096
  check-text: true
  max-display-name-length: 128
  max-lore-lines: 20
  max-lore-line-length: 256
  check-attribute-modifiers: true
  max-attribute-modifiers: 16
  max-attribute-amount: 1024.0
  max-attribute-amounts:
    ATTACK_SPEED: 32.0
    ATTACK_DAMAGE: 256.0
    MOVEMENT_SPEED: 4.0
    FLYING_SPEED: 4.0
    STEP_HEIGHT: 10.0
    SCALE: 16.0
    ENTITY_INTERACTION_RANGE: 64.0
    BLOCK_INTERACTION_RANGE: 64.0
  # These flags can conflict with legitimate custom-item plugins. Test first.
  unsafe-flags:
    block-attribute-modifiers: true
    block-unbreakable: true
    block-hide-tooltip: true
    block-custom-model-data: true
    block-custom-max-stack-size: true
    block-fire-resistant: true
    block-rarity: true
  check-nested-items: true
  max-nested-depth: 2

# English runtime messages. English mode also extracts lang/en_US.yml for customization.
messages:
  prefix: '&#00D2FF&l[&#3A7BD5&lICUAC&#00D2FF&l] &8&l» &7'
