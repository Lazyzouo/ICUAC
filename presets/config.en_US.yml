    - '&#FF5E62-------&#FF9966-------&#F2C94C-------&#FF9966-------&#FF5E62-------'
    - '&#FF5E62&l[01] &#F2C94C&lWhitelist Management'
    - '&#FF9966› &f/icuac add <player> &8- &7Add a security bypass'
