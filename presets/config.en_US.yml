  command-add-usage: '{prefix}&8[&e!&8] &e&lInvalid arguments &8| &7Usage: &f/icuac add <player>'
  command-remove-usage: '{prefix}&8[&e!&8] &e&lInvalid arguments &8| &7Usage: &f/icuac remove <player>'
  reload-success: '{prefix}&8[&a+&8] &a&lReload complete &8| &7Configuration and all security modules were reloaded.'
  crystal-limit-usage: '{prefix}&8[&e!&8] &e&lInvalid arguments &8| &7Usage: &f/crystallimit bypass'
  crystal-limit-bypassed: '{prefix}&8[&a+&8] &a&lLimit bypassed &8| &7End crystal attack cooldown no longer applies to you.'
  crystal-limit-restored: '{prefix}&8[&e!&8] &e&lLimit restored &8| &7End crystal attack cooldown applies to you again.'
  unknown-command: '&cUnknown command. Type "/help" for help.'
  crystal-reload-success: '{prefix}&8[&a+&8] &a&lReload complete &8| &7Current crystal attack interval: &f{interval}ms'
  update-checking: 'Checking GitHub for updates...'
  update-latest: 'Version {version} is already the latest release.'
  update-available: 'A new version {latest} is available; current version is {current}.'
  update-downloaded: 'Version {version} was downloaded and will be installed on the next server restart.'
  update-failed: 'Automatic update failed: {reason}. Download manually from {url}.'
  update-manual: 'Version {version} is available. Download it from {url}.'
